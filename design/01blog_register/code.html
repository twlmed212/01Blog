<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-background font-body-md text-body-md text-on-surface antialiased">
<main class="min-h-screen flex items-center justify-center p-gutter">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-md p-8 sm:p-10">
<!-- Logo -->
<div class="flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-xl bg-primary-container text-on-primary flex items-center justify-center shadow-md mb-space-sm"><span class="material-symbols-outlined text-2xl">edit_note</span></div>
<span class="font-headline-lg text-headline-lg text-on-surface">01Blog</span>
<p class="text-on-surface-variant mt-1">Create your account</p>
</div>
<!-- Error message: show only when registration fails (e.g. username taken, passwords don't match) -->
<div class="mt-6 flex items-center gap-2 p-3 rounded-lg bg-error-container text-on-error-container font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[18px]">error</span>Username already taken.
</div>
<form class="mt-6 flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container" id="username" placeholder="alex_turner" required type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container" id="email" placeholder="alex@example.com" required type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container" id="password" placeholder="At least 8 characters" required type="password">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirm-password">Confirm password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-11 pl-10 pr-3.5 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container" id="confirm-password" placeholder="Repeat your password" required type="password">
</div>
</div>
<button class="mt-2 w-full h-11 bg-primary-container hover:bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-sm" type="submit">Register</button>
</form>
<p class="mt-6 text-center font-body-sm text-body-sm text-on-surface-variant">Already have an account? <a class="font-title-md text-primary-container hover:underline" href="../01blog_login/code.html">Log in</a></p>
</div>
</main>
</body>
</html>
