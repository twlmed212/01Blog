<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
<!-- Report dialog: opened from another user's block. Step 1 = reason, step 2 = confirmation -->
<div class="fixed inset-0 bg-on-background/40 flex items-center justify-center p-gutter">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-2xl shadow-xl">
<!-- Step 1: reason -->
<div id="step1">
<form class="p-space-lg flex flex-col gap-space-md" onsubmit="event.preventDefault(); step1.classList.add('hidden'); step2.classList.remove('hidden');">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Report @liam_chen</h2>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="reason">Reason</label>
<textarea class="w-full p-3 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container resize-none" id="reason" placeholder="Explain why you are reporting this user…" required rows="4"></textarea>
</div>
<div class="flex justify-end gap-space-sm">
<a class="inline-flex items-center px-space-md h-10 rounded-lg text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg" href="../01blog_user_block_public_profile/code.html">Cancel</a>
<button class="inline-flex items-center px-space-md h-10 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg shadow-sm" type="submit">Report</button>
</div>
</form>
</div>
<!-- Step 2: confirmation -->
<div class="hidden" id="step2">
<div class="p-space-lg flex flex-col gap-space-md">
<div class="w-11 h-11 rounded-full bg-error-container text-error flex items-center justify-center"><span class="material-symbols-outlined">warning</span></div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Are you sure?</h2>
<p class="text-on-surface-variant">Do you really want to report @liam_chen? An admin will review your report.</p>
<div class="flex justify-end gap-space-sm">
<button class="inline-flex items-center px-space-md h-10 rounded-lg text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg" onclick="step2.classList.add('hidden'); step1.classList.remove('hidden');" type="button">Back</button>
<a class="inline-flex items-center px-space-md h-10 rounded-lg bg-error hover:opacity-90 text-on-error font-label-lg text-label-lg shadow-sm" href="../01blog_user_block_public_profile/code.html">Confirm</a>
</div>
</div>
</div>
</div>
