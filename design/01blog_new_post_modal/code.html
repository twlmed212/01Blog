<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
<!-- Post form dialog: opened from My Block. Same dialog for edit: title "Edit post", button "Save" -->
<div class="fixed inset-0 bg-on-background/40 flex items-center justify-center p-gutter">
<div class="w-full max-w-[560px] bg-surface-container-lowest rounded-2xl shadow-xl flex flex-col">
<div class="flex items-center justify-between px-space-lg pt-space-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface">New post</h2>
<a class="w-9 h-9 rounded-full flex items-center justify-center text-outline hover:bg-surface-container" href="../01blog_my_block_own_profile/code.html" title="Close"><span class="material-symbols-outlined">close</span></a>
</div>
<form class="p-space-lg flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<textarea class="w-full p-3 bg-surface-container-low rounded-lg text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary-container resize-none" placeholder="What did you learn today?" required rows="5"></textarea>
<!-- Media preview: shown after a file is selected -->
<div class="relative rounded-xl bg-surface-container aspect-video flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-[40px]">image</span>
<button class="absolute top-2 right-2 w-8 h-8 rounded-full bg-inverse-surface/80 text-inverse-on-surface flex items-center justify-center hover:bg-inverse-surface" title="Remove media" type="button"><span class="material-symbols-outlined text-[18px]">close</span></button>
</div>
<!-- File picker: one image or video -->
<label class="self-start inline-flex items-center gap-space-xs px-space-md h-10 rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container-low font-label-lg text-label-lg cursor-pointer">
<span class="material-symbols-outlined text-[20px]">attach_file</span>Add image or video
<input accept="image/*,video/*" class="hidden" type="file">
</label>
<div class="flex justify-end gap-space-sm pt-space-sm">
<a class="inline-flex items-center px-space-md h-10 rounded-lg text-on-surface-variant hover:bg-surface-container font-label-lg text-label-lg" href="../01blog_my_block_own_profile/code.html">Cancel</a>
